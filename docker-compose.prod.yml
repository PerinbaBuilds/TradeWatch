# Production overlay — apply ON TOP of the core (or full) stack:
#
#   cp .env.docker.example .env   # then set TRADEWATCH_API_KEY, DOMAIN, …
#   docker compose -f docker-compose.core.yml -f docker-compose.prod.yml up -d --build
#
# What it changes for production:
#   • puts the API behind a Caddy reverse proxy with automatic HTTPS (80/443)
#   • the API is no longer exposed directly — only Caddy is public
#   • requires an API key, JSON logs, rate limiting, an audit trail
#   • adds CPU/memory limits and log rotation to every long-running service
services:
  tradewatch:
    ports: []          # not published directly; reached via Caddy
    environment:
      TRADEWATCH_API_KEY: "${TRADEWATCH_API_KEY:?set a strong API key in .env}"
      TRADEWATCH_LOG_JSON: "true"
      TRADEWATCH_LOG_LEVEL: "INFO"
      TRADEWATCH_RATE_LIMIT_PER_MIN: "${TRADEWATCH_RATE_LIMIT_PER_MIN:-1200}"
      TRADEWATCH_CORS_ORIGINS: "${TRADEWATCH_CORS_ORIGINS:-}"
      TRADEWATCH_AUDIT_LOG_PATH: "/data/audit.jsonl"
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.5" }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: always

  caddy:
    image: caddy:2.8
    depends_on: [tradewatch]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: always

  producer:
    deploy:
      resources:
        limits: { memory: 512m, cpus: "0.5" }
    restart: always

  batch:
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }
    restart: always

volumes:
  caddy_data:
  caddy_config:
