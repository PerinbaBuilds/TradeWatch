# TradeWatch — CORE stack (lighter, ~4-6 GB RAM), all services genuinely live.
#
#   docker compose -f docker-compose.core.yml up --build
#
# Real, running services (the Platform page shows them UP):
#   • Kafka broker + producer            → live trade tape
#   • TradeWatch API (Kafka consumer)    → engine + dashboard + security + logs
#   • Hadoop HDFS (NameNode + DataNode)  → data lake
#   • Spark master + worker              → distributed compute cluster
#   • batch runner                       → recurring Spark + MapReduce jobs
#
# Drops Hive + Airflow (the heaviest/finickiest pieces) — use
# docker-compose.full.yml for those. URLs:
#   Dashboard ...... http://localhost:8000
#   Spark master ... http://localhost:8080
#   HDFS NameNode .. http://localhost:9870

services:
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  producer:
    build: .
    image: tradewatch:latest
    command: ["python", "examples/kafka_producer.py", "--bootstrap", "kafka:9092", "--topic", "trades", "--tps", "25"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  tradewatch:
    build: .
    image: tradewatch:latest
    ports: ["8000:8000"]
    environment:
      TRADEWATCH_SOURCE: "kafka"
      TRADEWATCH_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TRADEWATCH_KAFKA_TOPIC: "trades"
      TRADEWATCH_KAFKA_AUTO_OFFSET_RESET: "earliest"
      TRADEWATCH_LOG_JSON: "true"
      TRADEWATCH_AUDIT_LOG_PATH: "/data/audit.jsonl"
      # Only probe the services that exist in the core stack.
      TRADEWATCH_PLATFORM_SERVICES: "Kafka broker|kafka|9092|streaming,HDFS NameNode|namenode|9870|data-lake,Spark master|spark-master|8080|compute"
    volumes:
      - ./config:/app/config:ro
      - shared_data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      CLUSTER_NAME: tradewatch
    env_file: ["./hadoop/hadoop.env"]
    ports: ["9870:9870", "9000:9000"]
    volumes: ["hdfs_namenode:/hadoop/dfs/name"]
    restart: unless-stopped

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: ["./hadoop/hadoop.env"]
    volumes: ["hdfs_datanode:/hadoop/dfs/data"]
    depends_on: ["namenode"]
    restart: unless-stopped

  spark-master:
    image: bitnamilegacy/spark:3.5.6
    environment:
      SPARK_MODE: master
    ports: ["8090:8080", "7077:7077"]   # UI on host :8090 (avoids the common :8080 clash)
    restart: unless-stopped

  spark-worker:
    image: bitnamilegacy/spark:3.5.6
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on: ["spark-master"]
    restart: unless-stopped

  batch:
    build:
      context: .
      dockerfile: Dockerfile.batch
    image: tradewatch-batch:latest
    environment:
      BATCH_INTERVAL: "180"
      DATA_DIR: "/data"
    volumes:
      - shared_data:/data
    depends_on: ["spark-master"]
    restart: unless-stopped

volumes:
  hdfs_namenode:
  hdfs_datanode:
  shared_data:
